{% extends "base.html" %}
{% block content %}
<section class="crm-page crm-form-page">
    <p class="eyebrow">{{ company.name }} / ENQUIRIES</p>
    <h1>{{ page_title }}</h1>
    <form method="post" class="crm-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Enquiry</button>
        <a href="{% url 'companies:enquiries:list' company.slug %}">Cancel</a>
    </form>
</section>
{% endblock %}
