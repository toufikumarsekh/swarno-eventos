{% extends "base.html" %}

{% block content %}
<section class="company-registration">
    <h1>Login to Swarno EventOS</h1>
    <p>Sign in with your registered email address.</p>

    {% if form.errors %}
        <p style="color: #ff7777;">Invalid email or password. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="{{ form.username.id_for_label }}">Email</label>
            {{ form.username }}
        </div>

        <div>
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
        </div>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Login</button>
    </form>
</section>
{% endblock %}
